define tproxy_port = 3346

destroy table inet divert
table inet divert {
	chain divert_deliver {
		type filter hook prerouting priority dstnat + 50; policy accept;

		mark & $routing_mask != $routing_divert return

		meta l4proto { tcp, udp } tproxy to :$tproxy_port
	}

	chain divert_guard {
		type filter hook prerouting priority dstnat + 60; policy accept;

		mark & $routing_mask != $routing_divert return

		meta l4proto { tcp, udp } socket transparent 1 return
		meta l4proto { tcp, udp } drop
	}
}

include "nftables.conf.d/divert.conf.d/*.conf"
