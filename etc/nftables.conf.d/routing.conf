destroy table inet routing
table inet routing {
	chain prerouting_entry {
		type filter hook prerouting priority dstnat + 25; policy accept;

		jump routing_entry
	}

	chain prerouting_probe {
		type filter hook prerouting priority dstnat + 26; policy accept;

		mark & $routing_mask != $routing_probe return

		fib daddr . mark oifname $routing_probe_interface mark set mark & $routing_clear_mask | $routing_gateway return
		mark set mark & $routing_clear_mask | $routing_specific
	}

	chain prerouting_select {
		type filter hook prerouting priority dstnat + 27; policy accept;

		jump routing_select
	}

	chain prerouting_finish {
		type filter hook prerouting priority dstnat + 47; policy accept;

		jump routing_finish
	}

	chain output_entry {
		type route hook output priority dstnat + 25; policy accept;

		jump routing_entry
	}

	chain output_probe {
		type filter hook output priority dstnat + 26; policy accept;

		mark & $routing_mask != $routing_probe return

		rt ip nexthop $routing_probe_nexthop4 mark set mark & $routing_clear_mask | $routing_gateway return
		rt ip6 nexthop $routing_probe_nexthop6 mark set mark & $routing_clear_mask | $routing_gateway return
		mark set mark & $routing_clear_mask | $routing_specific
	}

	chain output_select {
		type filter hook output priority dstnat + 27; policy accept;

		jump routing_select
	}

	chain output_finish {
		type route hook output priority dstnat + 47; policy accept;

		jump routing_finish
	}

	chain routing_entry {
		ct state { invalid, untracked } return
		fib daddr type != { local, unicast } return

		mark & $routing_mask != $routing_unassigned goto routing_save

		ct direction original ct mark & $routing_original_mask != $routing_unassigned return
		ct direction reply ct mark & $routing_reply_mask != $routing_unassigned return

		mark set mark & $routing_clear_mask | $routing_probe
	}

	chain routing_select {
		mark & $routing_mask != $routing_pending return
	}

	chain routing_save {
		ct direction original ct mark set ct mark & $routing_original_clear_mask | mark & $routing_mask
		ct direction reply ct mark set ct mark & $routing_reply_clear_mask | (mark & $routing_mask) << $routing_reply_shift
	}

	chain routing_finish {
		ct state { invalid, untracked } return
		fib daddr type != { local, unicast } return

		mark & $routing_mask != { $routing_unassigned, $routing_pending } return

		ct direction original ct mark & $routing_original_mask == $routing_unassigned ct mark set ct mark & $routing_original_clear_mask | $routing_normal
		ct direction reply ct mark & $routing_reply_mask == $routing_unassigned ct mark set ct mark & $routing_reply_clear_mask | $routing_normal << $routing_reply_shift

		goto routing_restore
	}

	chain routing_restore {
		ct direction original mark set mark & $routing_clear_mask | ct mark & $routing_original_mask
		ct direction reply mark set mark & $routing_clear_mask | (ct mark & $routing_reply_mask) >> $routing_reply_shift
	}
}

include "nftables.conf.d/routing.conf.d/*.conf"
