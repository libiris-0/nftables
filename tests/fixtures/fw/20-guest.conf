# Test-only guest policy. Not a deployment configuration.
table inet fw {
	set ifname_guest {
		type ifname
		flags interval
		elements = { "virbr*" }
	}

	chain input_guest {
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert } accept
		ct status dnat accept
		tcp dport 22 accept
		udp dport 53 accept
		goto handle_reject
	}

	chain forward_guest {
		jump accept_to_wan
		jump accept_to_guest
		goto handle_reject
	}

	chain output_guest {
		accept
	}

	chain accept_to_guest {
		oifname @ifname_guest accept
	}
}

add rule inet fw input iifname @ifname_guest goto input_guest
add rule inet fw forward iifname @ifname_guest goto forward_guest
add rule inet fw output oifname @ifname_guest goto output_guest
