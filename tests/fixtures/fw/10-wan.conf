# Test-only WAN policy. Not a deployment configuration.
table inet fw {
	set ifname_wan {
		type ifname
		flags interval
		elements = { "en*" }
	}

	chain input_wan {
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert } accept
		ct status dnat accept
		tcp dport 22 accept
		udp dport 31000 accept
		goto handle_reject
	}

	chain forward_wan {
		goto handle_reject
	}

	chain output_wan {
		accept
	}

	chain srcnat_wan {
		meta nfproto ipv4 masquerade
	}

	chain accept_to_wan {
		oifname @ifname_wan accept
	}
}

add rule inet fw input iifname @ifname_wan goto input_wan
add rule inet fw forward iifname @ifname_wan goto forward_wan
add rule inet fw output oifname @ifname_wan goto output_wan
add rule inet fw srcnat oifname @ifname_wan goto srcnat_wan
